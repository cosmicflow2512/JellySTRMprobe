name: "JellySTRMprobe"
guid: "b8f5e3a1-d4c7-4f2e-9a6b-1c8d3e5f7a9b"
version: "1.6.1.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "cosmicflow2512"
overview: "Probe STRM files to extract media info (codec, resolution, duration, audio)"
description: |
  JellySTRMprobe extracts media information from STRM file targets by probing
  remote streams. Jellyfin never probes STRM files during library scans — this
  plugin fills that gap.

  Features:
  - Scheduled task to probe all unprobed STRM items
  - Optional scheduled task (off by default) to generate trickplay scrubbing
    previews for STRM items, which Jellyfin skips by design
  - Catch-up mode to auto-probe new STRM items as they are added
  - Configurable parallelism, timeout, and cooldown
  - Per-library selection for targeted probing

  This plugin is designed to work alongside Xtream Library or any other STRM
  file generator.
category: "General"
artifacts:
  - "JellySTRMprobe.dll"
changelog: |
  ## v1.6.1.0
  - New setting "Timeout per item" (default 60 minutes, 0 = no limit) for the trickplay
    task. Jellyfin already kills an ffmpeg that stops producing images, but an item that
    trickles along slowly could otherwise occupy a run for hours with no way out short of
    cancelling the whole task. A timed-out item is logged and the run continues
  - Cancelling the trickplay task is no longer reported as a generation failure. Killing
    ffmpeg surfaces as a plain exception rather than OperationCanceledException, so the
    cancellation was previously logged as an error
  ## v1.6.0.0
  - Trickplay is now opt-in and off by default. Generating it streams every file in
    full, so a run takes a long time; the new "Enable STRM trickplay" setting keeps
    the task hidden from Scheduled Tasks and refuses to run until you turn it on.
    Toggling it takes effect without a server restart
  - Fix: with "Maximum items per run" set, the trickplay task re-selected the same
    first N items on every run and never reached the rest of the library. Items that
    already have trickplay are now filtered out before the limit is applied, so
    repeated capped runs work through the library incrementally
  ## v1.5.0.0
  - New scheduled task "Generate STRM Trickplay": creates trickplay scrubbing
    previews for STRM items. Jellyfin's own trickplay generation skips them
    because BaseVideoResolver marks .strm files as IsShortcut and
    TrickplayManager.CanGenerateTrickplay() rejects shortcuts
  - Requires the probe task to have run first (needs a duration and a video stream)
  - No default trigger; run manually or add a schedule in Scheduled Tasks
  - New setting "Maximum items per run" (default 50, 0 = unlimited) so an
    accidental run cannot pull the entire library through the provider
  ## v1.4.0.0
  - Catch-up mode now also reprobes newly added STRM items that already have
    media streams but a missing duration (RunTimeTicks null/0), matching the
    scheduled task's selection
  ## v1.3.0.0
  - Also reprobe STRM items that already have media streams but a missing
    duration (RunTimeTicks null/0), not just items with no stream data at all
  ## v1.2.0.0
  - Delete failed STRM files after probing (opt-in)
  - Configurable failure threshold to prevent mass deletion when provider is down
  ## v1.0.0.0
  - Initial release
  - Scheduled task for bulk STRM probing
  - Catch-up mode for new items
  - Configuration UI with library selection
